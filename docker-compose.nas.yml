# ============================================================
# 绿联 DXP4800 专用 docker-compose（远程自动更新版）
# 用法：docker compose -f docker-compose.nas.yml up -d
# ============================================================
# 改动：
#   1. blog 容器改用 Docker Hub 镜像，不本地 build
#   2. 新增 watchtower 容器：自动检测镜像更新并重启
# ============================================================

services:
  blog:
    image: harper0322/my-blog:latest
    container_name: my-blog
    ports:
      - "8080:80"
    restart: unless-stopped
    # 给 watchtower 做标记：只要带这个 label 的容器才会自动更新
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 只更新带 label 的容器，不影响 NAS 里其他容器
      - WATCHTOWER_LABEL_ENABLE=true
      # 每 5 分钟检查一次（300 秒），可按需调整
      - WATCHTOWER_POLL_INTERVAL=300
      # 更新后自动清理旧镜像，省空间
      - WATCHTOWER_CLEANUP=true
      # 中国时区，日志时间好看
      - TZ=Asia/Shanghai
