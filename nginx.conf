server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # favicon with correct MIME type and caching
    location = /favicon.ico {
        types { image/x-icon ico; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # view-counts.json - browse count data (updated periodically)
    location = /view-counts.json {
        types { application/json json; }
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    # static assets with long cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # sitemap, robots, rss
    location ~ ^/(sitemap|robots|rss) {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # html pages with no cache (for content updates)
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
