server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # favicon with correct MIME type and caching
    location = /favicon.ico {
        types { image/x-icon ico; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # umami API reverse proxy to avoid CORS issues
    location /api/umami/ {
        proxy_pass http://umami:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # static assets with long cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # sitemap, robots, rss
    location ~ ^/(sitemap|robots|rss) {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # html pages with no cache (for content updates)
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
