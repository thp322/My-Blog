# 自定义 Nginx 优化配置（挂到 nginx-proxy 的 conf.d 目录，只能放 http 级别的配置）
# 注意：不能写 server {} 或 location {}，这些必须放在 server 块里
# location 级别的缓存配置已在博客容器内部的 nginx.conf 中配置

# gzip 压缩
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml
  application/xml+rss
  application/atom+xml
  image/svg+xml
  font/ttf
  font/opentype
  application/font-woff
  application/vnd.ms-fontobject;

# 上传文件大小限制
client_max_body_size 16M;
