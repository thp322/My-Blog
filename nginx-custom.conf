# 自定义 Nginx 优化配置（挂到 nginx-proxy）
# 如果不需要可以直接清空或删除挂载行

# gzip
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml
  application/xml+rss
  application/atom+xml
  image/svg+xml
  font/ttf
  font/opentype
  application/font-woff
  application/vnd.ms-fontobject;

# 上传文件大小限制（博客用不到，但保留一下）
client_max_body_size 16M;

# 给静态资源加缓存头
location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
