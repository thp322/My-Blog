# ============================================================
# 阿里云轻量服务器生产部署：博客 + Watchtower + Nginx 反代 + 自动 HTTPS
# 域名：harperlog.cn
# 服务器公网 IP：47.107.135.232
#
# 用法：
#   cd /opt/my-blog
#   docker compose -f docker-compose.prod.yml up -d
#
# 包含的服务：
#   1. blog              — 博客容器（内部端口 80，不对外暴露）
#   2. watchtower        — 自动更新博客镜像（v1.7.1 固定版本）
#   3. nginx-proxy       — 80/443 入口，反代到 blog 容器（v1.6 固定版本）
#   4. acme-companion    — 自动申请 & 续期 Let's Encrypt 免费 HTTPS 证书（v2.4 固定版本）
#
# 前置条件（必须先做！）：
#   1. 域名 harperlog.cn 和 www.harperlog.cn 已解析到服务器公网 IP 47.107.135.232
#   2. 域名已完成 ICP 备案（当前备案号：湘ICP备2025140854号）
#   3. 阿里云安全组/防火墙已放行 80 和 443 端口入方向
#   4. Docker 镜像 harper0322/my-blog:latest 已推送到 Docker Hub
# ============================================================

services:
  blog:
    image: harper0322/my-blog:latest
    container_name: my-blog
    restart: unless-stopped
    # 不对外暴露端口，只给 Nginx 反代访问
    expose:
      - "80"
    environment:
      # nginx-proxy 配置：告诉反代我这个容器响应哪个域名
      VIRTUAL_HOST: harperlog.cn,www.harperlog.cn
      VIRTUAL_PORT: 80
      # acme-companion 配置：告诉它要给这个域名签证书
      LETSENCRYPT_HOST: harperlog.cn,www.harperlog.cn
      LETSENCRYPT_EMAIL: 3301108476@qq.com
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy-net

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_DOCKER_API_VERSION=1.43
      - TZ=Asia/Shanghai

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      # 自定义 Nginx 配置（优化性能），如果不需要可以删掉这一行
      - ./nginx-custom.conf:/etc/nginx/conf.d/custom.conf:ro
    environment:
      - TZ=Asia/Shanghai
      - DEFAULT_HOST=harperlog.cn
    networks:
      - proxy-net

  acme-companion:
    image: nginxproxy/acme-companion:2.4
    container_name: acme-companion
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - TZ=Asia/Shanghai
      - DEFAULT_EMAIL=3301108476@qq.com
    depends_on:
      - nginx-proxy
    networks:
      - proxy-net

volumes:
  certs:
  vhost:
  html:
  acme:

networks:
  proxy-net:
    name: proxy-net
