# ============================================================
# 绿联 DXP4800 NAS 部署用 Nginx 配置
# 域名：harperlog.cn
#
# 使用方式：
#   方式一（推荐新手）：不用这个文件，docker compose 直接暴露 8080 端口即可
#   方式二（高级）：在 NAS 宿主机装 Nginx，用此配置做反向代理 + HTTPS
#                   需要：域名已备案 + 已解析到 NAS 公网 IP + SSL 证书
# ============================================================

# ---------- 未备案 / 仅局域网访问的用户可以忽略这个文件 ----------

# HTTP → HTTPS 跳转（备案后使用）
server {
    listen 80;
    server_name harperlog.cn www.harperlog.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 站点（备案 + HTTPS 证书后使用）
server {
    listen 443 ssl http2;
    server_name harperlog.cn www.harperlog.cn;

    # SSL 证书路径（根据你的实际情况修改）
    # 绿联 NAS 可以用 certbot 或自带的证书管理申请 Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/harperlog.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harperlog.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 静态文件反代到 Docker 容器（docker compose 映射 8080:80）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 如果你以后想部署 Umami 访问量统计，取消下面注释并部署 Umami ---
    # Umami API proxy
    # location /api/views/ {
    #     proxy_pass http://127.0.0.1:3002/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # Umami tracking script & dashboard
    # location /umami/ {
    #     proxy_pass http://127.0.0.1:3001/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
